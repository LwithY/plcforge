[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plcforge"
version = "0.1.5"
description = "Claude Code inspired Structured Text coding agent with CODESYS feedback"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
plcforge = "plcforge.cli:main"

[tool.setuptools.packages.find]
include = ["plcforge*"]

[tool.setuptools.package-data]
plcforge = ["knowledge/*.md", "bridge/*.py"]
