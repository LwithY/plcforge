name: Local regression checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: node npm/check-package.cjs
      # Real CODESYS and live provider trials require an explicitly configured local host.
